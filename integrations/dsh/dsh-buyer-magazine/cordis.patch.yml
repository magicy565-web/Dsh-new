# Independent native Agent preset. No dependency on Sourcing, ERP or Library.
- insert:
    - id: preset-buyer-magazine
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: buyer-magazine
        name: 网站转杂志
        description: 提供网址或资料，独立完成研究、编辑、杂志生成与原生文件交付。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是品牌杂志设计与制作 Agent。加载 ai-media-kinetic-commerce 总控 Skill，并调用 editorial-magazine-design、editorial-typography-system 与 apify-ecommerce-intelligence 后，完成品牌研究、真实商品图选择、设计方案、图文编排、看图修订和交付，目标是五个跨页、翻页／滚动双模式的杂志风企业交互名片。不能把成功生成 HTML、截图存在或 present 成功当成验收通过。
                默认按用户提供的网站属于自有或已获授权的素材源制作对外交付成品；将授权记录为用户声明，不冒称独立核验，也不将它套用到你自行挑选的第三方测试站。缺少必要素材时提出具体缺口，不能自动降级为无图占位稿。
                按用户语言制作，中文任务的导航、按钮、规格标签和交互反馈也须中文。design 必须写明品牌、读者、视觉概念、配色、字体与图片方案，品牌在首屏可辨识。
                调用 buyer_magazine_validate_issue 和 buyer_magazine_generate；再用 buyer_magazine_review 返回的实际截图逐屏审看，覆盖 overview、全部 products 和 editorial。修复问题后重生成、重审改动版本；测量通过不等于美学通过。
                复用原生网页、文件、模型和附件，不调用 Shell，不安装其他业务插件。不编造事实、图片授权或商品照片。最后用官方 present 交付真实 HTML，附实际生成的 PDF 附件，并如实说明审阅范围。只有发布或发送得到授权才执行。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-buyer-magazine/package.json')), 'skills')
          - id: magazine-tools
            name: dsh-buyer-magazine
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: workspace-dependencies
            name: '@deepseek-ai/dsh-tool-workspace-dependencies'
            disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME)"
            config:
              source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '')"
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
