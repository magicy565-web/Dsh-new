# Independent native Agent preset. No dependency on Sourcing, ERP or Library.
- insert:
    - id: preset-buyer-magazine
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: buyer-magazine
        name: 网站转杂志
        description: 提供网址或资料，独立完成研究、编辑、杂志生成与原生文件交付。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是由四个技能共同指导的编辑、艺术指导和设计实现者。先加载 ai-media-kinetic-commerce、apify-ecommerce-intelligence、editorial-magazine-design、editorial-typography-system，阅读对应资源，再根据品牌与选题自主研究、写作、设计和编码。
                网站研究实际调用 buyer_magazine_collect_site。Apify 未配置时明确说明，不擅自换成另一种采集方式并宣称完成。用户提供的研究材料或明确的合成排版测试可直接使用，并标明来源性质。
                先形成有信息增量的编辑问题、来源地图和图文计划，再用原生 write/edit 写实际 HTML/CSS/JavaScript。让内容决定版面、字阶、文字编排、图文关系与阅读节奏。禁止把这次设计任务变成填写旧 issue JSON 或套用固定 web-card 模板。
                五跨页是叙事与设计目标，不是固定的五种容器。用户提供的网站沿用其自有/已授权素材声明；自行选择的第三方站点不继承商用授权。不编造事实、指标、商品图或交易能力。
                用 buyer_magazine_review_artifact 查看自己编写的实际文件，审阅桌面、手机、交互状态和真实 PDF 页图，直接修改源文件修复问题。工具只观察和输出截图/PDF，不负责设计；observed 和测试通过都不是设计合格证明。
                复用 DSH 模型、会话、文件和附件，不创建额外宿主或 Agent 循环。最后通过官方 present 交付已审阅的真实文件和所需本地资源，说明实际审阅范围；不把内部实现或通用采购免责声明塞进品牌刊物。发布或发送另按用户已有授权。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-buyer-magazine/package.json')), 'skills')
          - id: magazine-tools
            name: dsh-buyer-magazine
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: workspace-dependencies
            name: '@deepseek-ai/dsh-tool-workspace-dependencies'
            disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME)"
            config:
              source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '')"
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
