name: AI Worker | build, tests and real browser screenshots
on:
  push:
    branches:
      - main
      - feat/worker-connector-runtime-20261010
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "test/**"
      - "package*.json"
      - ".github/workflows/ai-worker-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build actual project
        run: npm run build:web
      - name: Worker API, A2A, storage tests
        run: node --test test/worker-desk.test.mjs test/worker-desk.http.test.mjs test/worker-a2a-adapter.test.mjs test/worker-a2a-host.test.mjs test/worker-delivery-artifact.test.mjs test/worker-a2a-network.test.mjs test/worker-opportunities.test.mjs test/worker-opportunities.http.test.mjs
      - name: Dot Pull Worker and actual MCP 2026/2025 protocol tests
        run: node --test test/dot-worker-bridge.test.mjs test/dot-worker.http.test.mjs test/dot-mcp.test.mjs
      - name: Muse Personal REST gateway and exact Skill contract
        run: node --test test/muse-worker.contract.test.mjs test/muse-worker.http.test.mjs test/muse-worker.recovery.test.mjs test/muse-worker.probe.test.mjs
      - name: Existing backend / DOM regression
        run: npm run test:all
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser desktop + mobile screenshots
        run: npm run test:browser
      - name: Enterprise opportunities desktop and mobile browser test
        run: node test/worker-opportunities.browser.mjs
      - name: Real expert icon, role dossier and team work-order browser test
        run: node test/cloud-expert-experience.browser.mjs
      - name: Muse, enterprise libraries and product hosting browser flow
        run: node test/muse-commerce.browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-worker-browser-evidence
          path: |
            evidence/browser/
            docs/screenshots/muse-commerce/
          if-no-files-found: warn
          retention-days: 7
