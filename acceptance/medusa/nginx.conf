upstream medusa_backend {
  zone medusa_backend 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server api:9000 resolve;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 5m;
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
  location = / { return 302 /dashboard/; }
  location = /dashboard { return 302 /dashboard/; }
  location ^~ /dashboard/assets/ { try_files $uri =404; }
  location /dashboard/ { try_files $uri $uri/ /dashboard/index.html; }
  location / { return 404; }
  location ~ ^/(admin|auth|store|agent|uploads|static)(/|$) {
    proxy_pass http://medusa_backend;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9000;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_redirect off;
  }
}
server {
  listen 9000;
  server_name _;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 5m;
  client_body_timeout 30s;
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:9000;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto http;
  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_next_upstream off;
  proxy_redirect off;
  location = /health {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://medusa_backend;
  }
  location ~ ^/(admin|auth|store|agent|uploads|static)(/|$) { proxy_pass http://medusa_backend; }
  location / { return 404; }
}
