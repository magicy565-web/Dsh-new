# Only the observed host-to-UI Docker peer may carry this single TLS origin.
# Host loopback probe: 172.21.0.1 -> UI 172.21.0.2:8080 (2026-10-17).
# Recheck the actual Caddy peer after enabling TLS or recreating this network.
map "$remote_addr|$http_host|$http_x_forwarded_proto" $medusa_https_edge {
  default 0;
  "172.21.0.1|medusa.cnsubscribe.xyz|https" 1;
}
map $medusa_https_edge $medusa_proxy_host {
  default 127.0.0.1:9000;
  1 medusa.cnsubscribe.xyz;
}
map $medusa_https_edge $medusa_proxy_proto {
  default http;
  1 https;
}
map $medusa_https_edge $medusa_proxy_port {
  default 9000;
  1 443;
}
upstream medusa_backend {
  zone medusa_backend 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server api:9000 resolve;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 5m;
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
  location = / { return 302 /dashboard/; }
  location = /dashboard { return 302 /dashboard/; }
  location ^~ /dashboard/assets/ { try_files $uri =404; }
  location /dashboard/ { try_files $uri $uri/ /dashboard/index.html; }
  location / { return 404; }
  location ~ ^/(admin|auth|store|agent|uploads|static)(/|$) {
    proxy_pass http://medusa_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $medusa_proxy_host;
    proxy_set_header X-Forwarded-Host $medusa_proxy_host;
    proxy_set_header X-Forwarded-Port $medusa_proxy_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $medusa_proxy_proto;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_redirect off;
  }
}
server {
  listen 9000;
  server_name _;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 5m;
  client_body_timeout 30s;
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:9000;
  proxy_set_header X-Forwarded-Host 127.0.0.1:9000;
  proxy_set_header X-Forwarded-Port 9000;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Forwarded "";
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto http;
  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_next_upstream off;
  proxy_redirect off;
  location = /health {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://medusa_backend;
  }
  location ~ ^/(admin|auth|store|agent|uploads|static)(/|$) { proxy_pass http://medusa_backend; }
  location / { return 404; }
}
