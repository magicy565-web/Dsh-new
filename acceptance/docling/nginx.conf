# Only the original Host's synchronous conversion endpoint and health probes.
# No credential values, access log, URL-selected upstream, retries or disk body buffering.
upstream docling_backend {
  zone docling_backend 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server docling:5001 resolve;
}
server {
  listen 8080;
  server_name _;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 6m;
  client_body_timeout 30s;
  keepalive_timeout 5s;
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:5001;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto http;
  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  proxy_next_upstream off;
  proxy_redirect off;
  location = /health {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://docling_backend;
  }
  location = /ready {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://docling_backend;
  }
  location = /v1/convert/file {
    if ($request_method != POST) { return 405; }
    proxy_pass http://docling_backend;
  }
  location / { return 404; }
}
