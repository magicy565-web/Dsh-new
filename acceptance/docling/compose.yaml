name: workspace-pr99-library
services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.37.0@sha256:6eda9c524992147c1b0b06a1a9be4894bd68b1f43c86d92c32f996c4c60d18a3
    platform: linux/amd64
    user: "1001:0"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DOCLING_SERVE_CONFIG_FILE: /run/secrets/docling.json
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      UVICORN_WORKERS: "1"
      DOCLING_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      DOCLING_DEVICE: cpu
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    secrets:
      - source: docling_config
        target: docling.json
    tmpfs: ["/tmp:uid=1001,gid=0,mode=0700,size=268435456"]
    networks: [parser]
    cpus: 1.0
    mem_limit: 3g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5001/health", timeout=2).read()']
      start_period: 60s
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
  ingress:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: [127.0.0.1:5001:8080]
    configs:
      - source: ingress_config
        target: /etc/nginx/conf.d/default.conf
    tmpfs: [/tmp]
    networks: [parser, ingress]
    depends_on:
      docling: {condition: service_healthy}
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
networks:
  parser: {internal: true}
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
      com.docker.network.bridge.gateway_mode_ipv4: nat
configs:
  ingress_config: {file: ./nginx.conf}
secrets:
  docling_config:
    file: '${WORKSPACE_SERVICES_STATE_DIR:?explicit persistent state directory required}/secrets/docling.json'
