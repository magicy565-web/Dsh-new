version: 1
name: local
server: { host: 127.0.0.1, port: 8790 }
plugins:
  # Seam providers (work package B): storage/approval/tools.
  - id: storage
    name: '@workspace-harness/seams/storage'
    config: { directory: .harness-data }
  - id: approval
    name: '@workspace-harness/seams/approval'
  - id: tools
    name: '@workspace-harness/seams/tools'
  - id: artifacts
    name: '@workspace-harness/seams/artifacts'
  # 元数据审计：记忆提出/审核/撤回都写入同一条 durable audit trail。
  - id: audit
    name: '@workspace-harness/seams/audit'
    config: { limit: 1000 }
  # 工作空间（企业）成员：经营记忆按这里解析出的 workspaceId 分区，
  # 每个企业一套独立记忆；成员角色而不是请求头声明决定写权限。
  - id: workspace
    name: '@workspace-harness/seams/workspace'
    config:
      defaultWorkspaceId: local
      workspaces:
        - id: local
          name: 本地空间
          members:
            - { subject: local-operator, role: admin }
  # Business plugin (work package C) is enabled once plugins/workspace-inquiries exists:
  # - id: inquiries
  #   name: workspace-inquiries
  #   config: {}
  # Muse AI Worker 市场：/market 页面 + /api/market/* + 工作电脑 desk 只读工具。
  # demo: true 只给本地组合；生产组合去掉这一行或设 false（空目录，不读演示夹具）。
  - id: market
    name: workspace-market
    config: { demo: true }
  # 产品资料库：以 Medusa 商品 + 已审核 Product Context 为事实底座的产品空间。
  # 不配置 source 时只开放已有 room，status.configured=false；配置专用 readTokenFile
  # （绝对路径、0600）后才连接真实 Medusa Agent 面。写入一律走审批票据。
  - id: product-library
    name: workspace-product-library
    config: { workspaceId: local }
  # 企业经营记忆：每个企业一套独立、来源固定、人工审核的业务记忆。
  # 模型只能召回和提出候选；管理员在 /business-memory 区域审核后才成为事实。
  # productLibraryBaseURL 配置后，product-page 来源会按产品库的精确版本与 SHA 核对。
  - id: business-memory
    name: workspace-business-memory
    config: { workspaceId: local, productLibraryBaseURL: 'http://127.0.0.1:8790' }

