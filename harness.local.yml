version: 1
name: local
server: { host: 127.0.0.1, port: 8790 }
plugins:
  # Seam providers (work package B): storage/approval/tools.
  - id: storage
    name: '@workspace-harness/seams/storage'
    config: { directory: .harness-data }
  - id: approval
    name: '@workspace-harness/seams/approval'
  - id: tools
    name: '@workspace-harness/seams/tools'
  - id: artifacts
    name: '@workspace-harness/seams/artifacts'
  # 元数据审计：记忆提出/审核/撤回都写入同一条 durable audit trail。
  - id: audit
    name: '@workspace-harness/seams/audit'
    config: { limit: 1000 }
  # 工作空间（企业）成员：经营记忆按这里解析出的 workspaceId 分区，
  # 每个企业一套独立记忆；成员角色而不是请求头声明决定写权限。
  - id: workspace
    name: '@workspace-harness/seams/workspace'
    config:
      defaultWorkspaceId: local
      workspaces:
        - id: local
          name: 本地空间
          members:
            - { subject: local-operator, role: admin }
            # 执行器以系统成员身份调用工具；它与人类决策分开，权限只到 operator。
            - { subject: 'service:runner', role: operator }
  # Business plugin (work package C) is enabled once plugins/workspace-inquiries exists:
  # - id: inquiries
  #   name: workspace-inquiries
  #   config: {}
  # Muse AI Worker 市场：/market 页面 + /api/market/* + 工作电脑 desk 只读工具。
  # demo: true 只给本地组合；生产组合去掉这一行或设 false（空目录，不读演示夹具）。
  - id: market
    name: workspace-market
    config: { demo: true }
  # 产品资料库：以 Medusa 商品 + 已审核 Product Context 为事实底座的产品空间。
  # 不配置 source 时只开放已有 room，status.configured=false；配置专用 readTokenFile
  # （绝对路径、0600）后才连接真实 Medusa Agent 面。写入一律走审批票据。
  - id: product-library
    name: workspace-product-library
    config: { workspaceId: local }
  # 企业经营记忆：每个企业一套独立、来源固定、人工审核的业务记忆。
  # 模型只能召回和提出候选；管理员在 /business-memory 区域审核后才成为事实。
  # productLibraryBaseURL 配置后，product-page 来源会按产品库的精确版本与 SHA 核对。
  # serviceTokenFile 配置后，另一个进程（应用侧）可以用专用令牌读取任务上下文；
  # 不配置时服务通道保持 503 关闭。令牌文件须为绝对路径且仅本人可读。
  #   serviceTokenFile: 'C:\Users\<you>\.workspace-secrets\business-memory.token'
  - id: business-memory
    name: workspace-business-memory
    config: { workspaceId: local, productLibraryBaseURL: 'http://127.0.0.1:8790' }
  # 会话与运行：聊天底座。只持有会话/消息/run/事件，不调用模型、不执行工具、不审批。
  # run 由后续的 workspace-runner 推进；外部只能取消。
  - id: chat
    name: workspace-chat
    config: { workspaceId: local }
  # 计划任务：到期把目标推进一步，走既有 chat → runner 管道；默认 15s tick。
  - id: schedules
    name: workspace-schedules
    config: { workspaceId: local, tickMs: 15000 }
  # 目标：把多次运行聚合成一个可追踪的目标；状态显式推进并审计。
  - id: goals
    name: workspace-goals
    config: { workspaceId: local }
  # 运维面：状态/计数/数据体积、备份与恢复；仅管理员。
  - id: ops
    name: workspace-ops
    config: { version: 0.1.0 }
  # 收件箱：计划触发、待批准汇总到一处；只存通知与引用，不复制业务数据。
  - id: inbox
    name: workspace-inbox
    config: { workspaceId: local }
  # 文件面：上传 UTF-8 文本、列表、元数据与预览；二进制只存不挂到模型。
  - id: files
    name: workspace-artifacts
    config: { workspaceId: local }
  # 技能：插件目录下的 skills/*（用户保存的指令）。消息可显式选择一个或多个。
  - id: skills
    name: '@workspace-harness/seams/skills'
    config: { scanOnMount: true }
  # 模型接缝：provider 注册表。默认没有 provider，调用会明确失败而不是编造回答。
  - id: llm
    name: '@workspace-harness/seams/llm'
  # 模型桥：默认关闭；enabled: true 且服务器环境存在 DEEPSEEK_API_KEY 时才注册真实 provider。
  - id: llm-bridge
    name: workspace-llm-bridge
    config: { enabled: false }
  # run 执行器：订阅 prepared run，装配历史 + 已确认记忆，调用 ctx.llm，写回回答。
  - id: runner
    name: workspace-runner
    config: { workspaceId: local, memory: true }

