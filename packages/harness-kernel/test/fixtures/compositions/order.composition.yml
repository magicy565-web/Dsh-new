version: 1
name: order
server: { host: 127.0.0.1, port: 0 }
plugins:
  # Dependency order is reversed on purpose: the consumer must be mounted AFTER the
  # provider even though it appears first in the composition.
  - id: consumer
    name: ../plugins/trace-consumer
    config: { label: consumer }
  - id: provider
    name: ../plugins/trace-provider
    config: { label: provider }
