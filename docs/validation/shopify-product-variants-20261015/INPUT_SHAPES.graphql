mutation ReviewedVariantInputShapes {
  productCreate(product: {title: "Synthetic schema-only product", status: DRAFT, productOptions: [{name: "Color", values: [{name: "Red"}, {name: "Blue"}]}]}) {
    product { id }
    userErrors { field message }
  }
  productVariantsBulkCreate(productId: "gid://shopify/Product/100", strategy: REMOVE_STANDALONE_VARIANT, variants: [
    {price: "12.50", inventoryItem: {sku: "SCHEMA-RED"}, optionValues: [{optionName: "Color", name: "Red"}], mediaId: "gid://shopify/MediaImage/1000"},
    {price: "15.00", inventoryItem: {sku: "SCHEMA-BLUE"}, optionValues: [{optionName: "Color", name: "Blue"}]}
  ]) { productVariants { id } userErrors { field message } }
}
